<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Breach Runner</title>
<meta name="description" content="Steer a rogue program down a neon data highway, dodge ICE firewalls, and harvest data shards before the trace catches you.">
<meta name="theme-color" content="#04060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B9%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --void:#04060b;
    --panel:#0a141f;
    --panel-2:#0d1b2a;
    --panel-edge:#12324a;
    --green:#39ff88;
    --green-dim:#1c8f52;
    --cyan:#4ce0ff;
    --cyan-dim:#1f7c99;
    --magenta:#ff3ec8;
    --red:#ff3b3b;
    --amber:#ffcf40;
    --ink:#cfece2;
    --ink-dim:#6f9a92;
    --font-mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, "SFMono-Regular", Menlo, monospace;
  }

  html,body{margin:0;padding:0; overscroll-behavior:none; background:var(--void);}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:22px 16px;
    box-sizing:border-box;
    background:
      radial-gradient(circle at 50% 20%, #0c1a28 0%, #04060b 62%);
    color:var(--ink);
    font-family:var(--font-mono);
    overflow-x:hidden;
  }

  *{box-sizing:border-box;}

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    width:100%;
  }

  .crt-frame{
    position:relative;
    width:min(94vw,560px);
    height:min(82vh,820px);
    min-height:480px;
    display:flex;
    flex-direction:column;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:12px;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(76,224,255,.06),
      0 30px 70px -25px rgba(0,0,0,.85),
      0 0 50px -14px rgba(57,255,136,.18);
  }

  .title-bar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    background:linear-gradient(180deg,#0f1e2e,#0a141f);
    border-bottom:1px solid var(--panel-edge);
    font-size:11.5px;
    color:var(--ink-dim);
    letter-spacing:.02em;
  }
  .dots{display:flex;gap:6px;flex-shrink:0;}
  .dots span{width:8px;height:8px;border-radius:50%;display:block;}
  .dots span:nth-child(1){background:#ff5f56;}
  .dots span:nth-child(2){background:#ffbd2e;}
  .dots span:nth-child(3){background:#27c93f;}
  .title-text{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    text-align:center;
  }
  .icon-btn{
    flex-shrink:0;
    background:transparent;
    border:1px solid var(--panel-edge);
    color:var(--cyan-dim);
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.04em;
    padding:3px 7px;
    border-radius:4px;
    cursor:pointer;
  }
  .icon-btn:hover{color:var(--cyan);border-color:var(--cyan-dim);}
  .icon-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:1px;}

  .hud{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:7px 16px;
    padding:8px 12px;
    background:#08111a;
    border-bottom:1px solid var(--panel-edge);
  }
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat .label{font-size:9.5px;letter-spacing:.1em;color:var(--ink-dim);}
  .stat .value{
    font-size:14px;
    font-variant-numeric:tabular-nums;
    color:var(--green);
    text-shadow:0 0 8px rgba(57,255,136,.45);
  }
  .pips{display:flex;gap:4px;margin-top:1px;}
  .pip{width:11px;height:11px;border-radius:2px;background:var(--green);box-shadow:0 0 6px rgba(57,255,136,.6);border:1px solid var(--green-dim);}
  .pip.lost{background:transparent;border-color:rgba(255,59,59,.5);box-shadow:none;}
  .meter{
    width:76px;height:9px;
    background:#0d1b2a;
    border:1px solid var(--cyan-dim);
    border-radius:4px;
    overflow:hidden;
    margin-top:2px;
  }
  .meter-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--magenta));}
  .meter.ready .meter-fill{animation:meterPulse 1s ease-in-out infinite;}
  @keyframes meterPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.6);}}
  .hud .spacer{flex:1;}

  .canvas-wrap{
    position:relative;
    flex:1;
    min-height:300px;
    background:var(--void);
    touch-action:none;
  }
  canvas{display:block;width:100%;height:100%;}

  .scanlines{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.04) 0px, rgba(255,255,255,.04) 1px, transparent 2px, transparent 3px);
    mix-blend-mode:overlay;
    opacity:.55;
  }
  .vignette{
    position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 100px 24px rgba(0,0,0,.78);
  }
  .hit-flash{
    position:absolute;inset:0;pointer-events:none;
    background:var(--red);opacity:0;
    transition:opacity .07s ease-out;
  }
  .hit-flash.on{opacity:.3;}

  .overlay{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:22px;
    background:rgba(4,7,12,.86);
    backdrop-filter:blur(2px);
    cursor:pointer;
  }
  .overlay.hidden{display:none;}
  .term-block{font-size:12.5px;line-height:1.7;max-width:100%;}
  .term-line{color:var(--ink);}
  .term-line.accent{color:var(--green);text-shadow:0 0 10px rgba(57,255,136,.5);font-weight:600;}
  .term-line.dim{color:var(--ink-dim);}
  .term-line.big{font-size:19px;letter-spacing:.04em;}
  .term-line.danger{color:var(--red);text-shadow:0 0 10px rgba(255,59,59,.5);}
  .key{
    display:inline-block;
    border:1px solid var(--cyan-dim);
    border-radius:3px;
    padding:0 5px;
    font-size:10.5px;
    color:var(--cyan);
    margin:0 1px;
    box-shadow:0 0 6px rgba(76,224,255,.25);
  }
  .cursor{display:inline-block;animation:blink 1s steps(1) infinite;color:var(--green);}
  @keyframes blink{50%{opacity:0;}}
  .reduced-motion .cursor{animation:none;}
  .reduced-motion .meter.ready .meter-fill{animation:none;filter:brightness(1.5);}

  .mobile-boost{
    display:none;
    position:absolute;
    right:14px;bottom:14px;
    width:64px;height:64px;
    border-radius:50%;
    border:2px solid var(--magenta);
    background:rgba(255,62,200,.14);
    color:var(--magenta);
    font-size:9.5px;
    letter-spacing:.04em;
    align-items:center;justify-content:center;
    text-align:center;
    -webkit-user-select:none;user-select:none;
  }
  @media (pointer:coarse){
    .mobile-boost{display:flex;}
  }

  .footer-hint{
    font-size:10.5px;
    color:var(--ink-dim);
    text-align:center;
    letter-spacing:.03em;
    max-width:520px;
  }
  .footer-hint .key{font-size:9.5px;}
</style>
</head>
<body>

<a href="./index.html" style="position:fixed;top:10px;left:10px;z-index:999;font:12px/1 Consolas,monospace;color:#baffc9;background:rgba(5,7,10,.75);border:1px solid #144024;border-radius:3px;padding:6px 10px;text-decoration:none;">&larr; arcade</a>

<script src="../buam-fx.js"></script>

<div class="stage">
  <div class="crt-frame" id="frame">
    <div class="title-bar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="title-text">root@breach:~$ ./highway_runner.bin</div>
      <button class="icon-btn" id="soundBtn" type="button">SND:ON</button>
    </div>
    <div class="hud">
      <div class="stat"><span class="label">SCORE</span><span class="value" id="scoreVal">000000</span></div>
      <div class="stat"><span class="label">BEST</span><span class="value" id="bestVal">000000</span></div>
      <div class="stat"><span class="label">SPD</span><span class="value" id="spdVal">000</span></div>
      <div class="stat"><span class="label">HULL</span><div class="pips" id="pips"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div></div>
      <div class="stat"><span class="label">OVERCLOCK</span><div class="meter" id="meterWrap"><div class="meter-fill" id="meterFill"></div></div></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="pauseBtn" type="button">PAUSE</button>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="game"></canvas>
      <div class="scanlines"></div>
      <div class="vignette"></div>
      <div class="hit-flash" id="hitFlash"></div>
      <div class="mobile-boost" id="mobileBoost">OVER<br/>CLOCK</div>
      <div class="overlay" id="overlay"></div>
    </div>
  </div>
  <div class="footer-hint"><span class="key">&larr;</span><span class="key">&rarr;</span> / <span class="key">A</span><span class="key">D</span> / drag steer &nbsp;&middot;&nbsp; <span class="key">SPACE</span> overclock &nbsp;&middot;&nbsp; <span class="key">P</span> pause</div>
</div>

<script>
(function(){
  "use strict";
  var FONT_STACK = '"Cascadia Code","JetBrains Mono","Fira Code",Consolas,monospace';
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reducedMotion){ document.documentElement.classList.add('reduced-motion'); }

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('canvasWrap');
  var overlay = document.getElementById('overlay');
  var hitFlash = document.getElementById('hitFlash');
  var mobileBoost = document.getElementById('mobileBoost');
  var soundBtn = document.getElementById('soundBtn');
  var pauseBtn = document.getElementById('pauseBtn');

  var scoreEl = document.getElementById('scoreVal');
  var bestEl = document.getElementById('bestVal');
  var spdEl = document.getElementById('spdVal');
  var pipEls = document.querySelectorAll('#pips .pip');
  var meterWrap = document.getElementById('meterWrap');
  var meterFill = document.getElementById('meterFill');

  var W = 0, H = 0, DPR = 1;
  var roadLeft = 0, roadWidth = 0;

  var STEER_ACCEL = 2600, STEER_MAX = 340, FRICTION_DECEL = 2200;
  var OVERCLOCK_DURATION = 3.0;

  var best = parseInt(localStorage.getItem('breachRunnerBest') || '0', 10) || 0;
  var soundOn = localStorage.getItem('breachRunnerSound') !== 'off';
  soundBtn.textContent = 'SND:' + (soundOn ? 'ON' : 'OFF');

  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    } else if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  }
  function playTone(freq, dur, type, vol){
    if(!soundOn || !audioCtx) return;
    type = type || 'sine'; vol = vol == null ? 0.15 : vol;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    var now = audioCtx.currentTime;
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }

  soundBtn.addEventListener('click', function(){
    soundOn = !soundOn;
    localStorage.setItem('breachRunnerSound', soundOn ? 'on' : 'off');
    soundBtn.textContent = 'SND:' + (soundOn ? 'ON' : 'OFF');
    if(soundOn) ensureAudio();
    if(window.buamFx) buamFx.setMuted(!soundOn);
  });
  if(window.buamFx) buamFx.setMuted(!soundOn);

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function randHex(){ return '0x'+Math.floor(Math.random()*255).toString(16).toUpperCase().padStart(2,'0'); }
  function randChar(){
    var set='01<>{}/\\$#%&+=';
    return set[Math.floor(Math.random()*set.length)];
  }

  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  // ---- game state ----
  var state = 'start'; // start | playing | paused | gameover
  var player = { x:0, y:0, w:40, h:54, vx:0 };
  var obstacles = [], bits = [], particles = [];
  var matrixCols = [];
  var distance = 0, bitScore = 0, score = 0, hull = 3;
  var meter = 0, overclockActive = false, overclockTimer = 0;
  var hitInvuln = 0, shake = 0;
  var obstacleTimer = 1, bitTimer = 1;
  var baseSpeed = 190, spawnInterval = 1.3, bitInterval = 0.9;
  var scrollSpeed = 60;
  var laneOffset = 0;
  var keys = { left:false, right:false };
  var dragging = false, desiredX = 0, dragPointerId = null;

  function resetGame(){
    distance = 0; bitScore = 0; score = 0; hull = 3;
    meter = 0; overclockActive = false; overclockTimer = 0;
    hitInvuln = 0; shake = 0;
    obstacles = []; bits = []; particles = [];
    obstacleTimer = 1.1; bitTimer = 0.6;
    baseSpeed = 190; spawnInterval = 1.3; bitInterval = 0.9;
    player.x = roadLeft + roadWidth/2; player.vx = 0;
    desiredX = player.x;
  }

  function resize(){
    var rect = wrap.getBoundingClientRect();
    W = rect.width; H = rect.height;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(W*DPR));
    canvas.height = Math.max(1, Math.round(H*DPR));
    ctx.setTransform(DPR,0,0,DPR,0,0);

    roadWidth = clamp(W*0.62, 190, 380);
    roadLeft = (W - roadWidth)/2;
    player.w = roadWidth*0.15;
    player.h = player.w*1.35;
    player.y = H*0.8;
    var minX = roadLeft+player.w/2+4, maxX = roadLeft+roadWidth-player.w/2-4;
    player.x = clamp(player.x || (roadLeft+roadWidth/2), minX, maxX);
    desiredX = player.x;

    initMatrix();
  }

  function initMatrix(){
    var spacing = 16;
    var count = Math.max(1, Math.ceil(W/spacing));
    matrixCols = [];
    for(var i=0;i<count;i++){
      matrixCols.push({ x:i*spacing+spacing/2, y:Math.random()*H*-1, speed:40+Math.random()*70, ch:randChar() });
    }
  }

  // ---- spawning ----
  function mkObstacle(x0,x1){
    var h = 34+Math.random()*10;
    return { x:x0, y:-h-Math.random()*30, w:x1-x0, h:h, type:'firewall' };
  }
  function spawnObstacleRow(){
    var roadX0 = roadLeft, roadX1 = roadLeft+roadWidth;
    if(Math.random() < 0.28){
      var blockW = roadWidth*(0.28+Math.random()*0.14);
      var bx0 = roadLeft + (roadWidth-blockW)/2;
      obstacles.push(mkObstacle(bx0, bx0+blockW));
    } else {
      var gapWidth = Math.max(player.w*1.9, roadWidth*0.34);
      var gapX0 = roadX0 + Math.random()*(roadWidth-gapWidth);
      var gapX1 = gapX0+gapWidth;
      if(gapX0-roadX0 > player.w*0.55) obstacles.push(mkObstacle(roadX0, gapX0));
      if(roadX1-gapX1 > player.w*0.55) obstacles.push(mkObstacle(gapX1, roadX1));
    }
  }
  function spawnBit(){
    var w=16,h=16;
    var x = roadLeft + Math.random()*(roadWidth-w);
    bits.push({ x:x, y:-h-Math.random()*20, w:w, h:h, hex:randHex(), collected:false });
  }

  function spawnParticle(x,y,vx,vy,life,color,size){
    particles.push({x:x,y:y,vx:vx,vy:vy,life:life,maxLife:life,color:color,size:size});
  }
  function spawnBurst(x,y,color,n){
    for(var i=0;i<n;i++){
      var a = Math.random()*Math.PI*2;
      var sp = 40+Math.random()*90;
      spawnParticle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,0.4+Math.random()*0.3,color,2+Math.random()*2);
    }
  }
  function spawnEngineTrail(dt){
    if(state!=='playing') return;
    if(Math.random() < dt*24){
      var color = overclockActive ? '255,62,200' : (Math.random()<0.5?'57,255,136':'76,224,255');
      spawnParticle(
        player.x + (Math.random()-0.5)*player.w*0.4,
        player.y + player.h*0.42,
        (Math.random()-0.5)*20,
        120+Math.random()*80,
        0.4+Math.random()*0.25,
        color, 2+Math.random()*2
      );
    }
  }
  function updateParticles(dt){
    for(var i=particles.length-1;i>=0;i--){
      var p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
      if(p.life<=0) particles.splice(i,1);
    }
  }

  function getPlayerHitbox(){
    var iw = player.w*0.16, ih = player.h*0.12;
    return { x: player.x-player.w/2+iw, y: player.y-player.h/2+ih, w: player.w-iw*2, h: player.h-ih*2 };
  }
  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function triggerFlash(){
    hitFlash.classList.add('on');
    setTimeout(function(){ hitFlash.classList.remove('on'); }, 90);
  }
  function triggerShake(mag){
    shake = reducedMotion ? 0 : mag;
  }

  function onHit(){
    hull -= 1;
    hitInvuln = 1.1;
    triggerFlash();
    triggerShake(9);
    playTone(110,.18,'sawtooth',0.18);
    if(hull <= 0){ gameOver(); }
  }
  function collectBit(b){
    bitScore += 8 + Math.round(baseSpeed/20);
    meter = Math.min(100, meter+14);
    spawnBurst(b.x+b.w/2, b.y+b.h/2, '76,224,255', 8);
    playTone(880,.06,'square',0.12);
  }
  function attemptOverclock(){
    if(state==='playing' && meter>=100 && !overclockActive){
      overclockActive = true;
      overclockTimer = OVERCLOCK_DURATION;
      hitInvuln = Math.max(hitInvuln, OVERCLOCK_DURATION);
      playTone(1400,.22,'sawtooth',0.14);
      setTimeout(function(){ playTone(2000,.18,'sawtooth',0.1); }, 90);
    }
  }

  // ---- state transitions ----
  function setState(next){
    state = next;
    if(next==='start'){
      overlay.classList.remove('hidden');
      overlay.innerHTML =
        '<div class="term-block">'+
        '<div class="term-line big accent">BREACH_RUNNER</div>'+
        '<div class="term-line dim">v2.4 // target: mainframe.core</div>'+
        '<div class="term-line">&nbsp;</div>'+
        '<div class="term-line">Outrun ICE firewalls, harvest data<br/>shards, reach maximum depth before<br/>you get traced.</div>'+
        '<div class="term-line">&nbsp;</div>'+
        '<div class="term-line"><span class="key">&larr;</span><span class="key">&rarr;</span> / <span class="key">A</span><span class="key">D</span> / drag &mdash; steer</div>'+
        '<div class="term-line"><span class="key">SPACE</span> &mdash; overclock (meter full)</div>'+
        '<div class="term-line"><span class="key">P</span> &mdash; pause</div>'+
        '<div class="term-line">&nbsp;</div>'+
        '<div class="term-line accent">[ press <span class="key">ENTER</span> or tap to initiate ]<span class="cursor">&#9608;</span></div>'+
        '</div>';
    } else if(next==='paused'){
      overlay.classList.remove('hidden');
      overlay.innerHTML =
        '<div class="term-block">'+
        '<div class="term-line big accent">SESSION SUSPENDED</div>'+
        '<div class="term-line">&nbsp;</div>'+
        '<div class="term-line dim">connection idle &mdash; trace clock stopped</div>'+
        '<div class="term-line">&nbsp;</div>'+
        '<div class="term-line accent">[ press <span class="key">P</span> or tap to resume ]<span class="cursor">&#9608;</span></div>'+
        '</div>';
    } else if(next==='gameover'){
      if(score > best){ best = score; localStorage.setItem('breachRunnerBest', String(best)); }
      overlay.classList.remove('hidden');
      overlay.innerHTML =
        '<div class="term-block">'+
        '<div class="term-line big danger">CONNECTION TERMINATED</div>'+
        '<div class="term-line dim">trace detected &mdash; session dropped</div>'+
        '<div class="term-line">&nbsp;</div>'+
        '<div class="term-line">SCORE&nbsp;&nbsp;&nbsp;'+String(Math.floor(score)).padStart(6,'0')+'</div>'+
        '<div class="term-line">BEST&nbsp;&nbsp;&nbsp;&nbsp;'+String(Math.floor(best)).padStart(6,'0')+'</div>'+
        '<div class="term-line">&nbsp;</div>'+
        '<div class="term-line accent">[ press <span class="key">ENTER</span> or tap to reconnect ]<span class="cursor">&#9608;</span></div>'+
        '</div>';
      playTone(220,.35,'triangle',0.16);
      setTimeout(function(){ playTone(140,.45,'triangle',0.14); }, 140);
    } else if(next==='playing'){
      overlay.classList.add('hidden');
    }
  }

  function startGame(){
    ensureAudio();
    resetGame();
    setState('playing');
    playTone(660,.08,'square',0.1);
  }
  function gameOver(){
    setState('gameover');
  }
  function togglePause(){
    if(state==='playing'){ setState('paused'); }
    else if(state==='paused'){ setState('playing'); }
  }

  setState('start');

  // ---- input ----
  window.addEventListener('keydown', function(e){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){ keys.left=true; e.preventDefault(); }
    else if(e.code==='ArrowRight'||e.code==='KeyD'){ keys.right=true; e.preventDefault(); }
    else if(e.code==='Space'){ e.preventDefault(); attemptOverclock(); }
    else if(e.code==='KeyP'||e.code==='Escape'){ e.preventDefault(); togglePause(); }
    else if(e.code==='Enter'){
      e.preventDefault();
      if(state==='start'||state==='gameover') startGame();
      else if(state==='paused') setState('playing');
    }
  });
  window.addEventListener('keyup', function(e){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){ keys.left=false; }
    else if(e.code==='ArrowRight'||e.code==='KeyD'){ keys.right=false; }
  });

  overlay.addEventListener('click', function(){
    if(state==='start'||state==='gameover') startGame();
    else if(state==='paused') setState('playing');
  });

  pauseBtn.addEventListener('click', function(){ togglePause(); });

  mobileBoost.addEventListener('pointerdown', function(e){
    e.preventDefault(); e.stopPropagation();
    attemptOverclock();
  });

  wrap.addEventListener('pointerdown', function(e){
    if(state!=='playing') return;
    dragging = true; dragPointerId = e.pointerId;
    var rect = wrap.getBoundingClientRect();
    desiredX = clamp(e.clientX-rect.left, roadLeft+player.w/2, roadLeft+roadWidth-player.w/2);
  });
  wrap.addEventListener('pointermove', function(e){
    if(!dragging || e.pointerId!==dragPointerId) return;
    var rect = wrap.getBoundingClientRect();
    desiredX = clamp(e.clientX-rect.left, roadLeft+player.w/2, roadLeft+roadWidth-player.w/2);
  });
  window.addEventListener('pointerup', function(e){
    if(e.pointerId===dragPointerId){ dragging=false; dragPointerId=null; }
  });

  window.addEventListener('blur', function(){
    if(state==='playing') setState('paused');
  });

  var ro = new ResizeObserver(function(){ resize(); });
  ro.observe(wrap);
  resize();
  resetGame();

  // ---- update ----
  function difficultyRamp(){
    var t = clamp(distance/2000, 0, 1);
    baseSpeed = lerp(190, 430, t);
    spawnInterval = lerp(1.3, 0.7, t);
    bitInterval = lerp(0.9, 0.5, t);
  }

  function update(dt){
    if(state!=='playing') return;

    difficultyRamp();
    scrollSpeed = baseSpeed * (overclockActive ? 1.7 : 1);
    distance += scrollSpeed*dt*0.02;

    obstacleTimer -= dt;
    if(obstacleTimer<=0){ spawnObstacleRow(); obstacleTimer = spawnInterval*(0.85+Math.random()*0.3); }
    bitTimer -= dt;
    if(bitTimer<=0){ spawnBit(); bitTimer = bitInterval*(0.8+Math.random()*0.4); }

    for(var i=obstacles.length-1;i>=0;i--){
      obstacles[i].y += scrollSpeed*dt;
      if(obstacles[i].y > H+60) obstacles.splice(i,1);
    }
    for(var j=bits.length-1;j>=0;j--){
      bits[j].y += scrollSpeed*dt;
      if(bits[j].collected || bits[j].y > H+40) bits.splice(j,1);
    }

    var minX = roadLeft+player.w/2+4, maxX = roadLeft+roadWidth-player.w/2-4;
    if(dragging){
      player.x += (desiredX-player.x)*Math.min(1, dt*10);
      player.vx = clamp((desiredX-player.x)*4, -STEER_MAX, STEER_MAX);
    } else {
      var dir = 0;
      if(keys.left) dir -= 1;
      if(keys.right) dir += 1;
      if(dir!==0){
        player.vx += dir*STEER_ACCEL*dt;
      } else {
        var s = player.vx>0?1:(player.vx<0?-1:0);
        var reduce = Math.min(Math.abs(player.vx), FRICTION_DECEL*dt);
        player.vx -= s*reduce;
      }
      player.vx = clamp(player.vx, -STEER_MAX, STEER_MAX);
      player.x += player.vx*dt;
    }
    if(player.x < minX){ player.x = minX; player.vx = 0; }
    if(player.x > maxX){ player.x = maxX; player.vx = 0; }

    if(hitInvuln>0) hitInvuln -= dt;

    if(overclockActive){
      overclockTimer -= dt;
      meter -= dt*(100/OVERCLOCK_DURATION);
      if(overclockTimer<=0 || meter<=0){
        overclockActive = false;
        meter = Math.max(meter,0);
      }
    }

    if(hitInvuln<=0){
      var hb = getPlayerHitbox();
      for(var k=0;k<obstacles.length;k++){
        if(rectsOverlap(hb, obstacles[k])){ onHit(); break; }
      }
    }
    var hb2 = getPlayerHitbox();
    for(var m=0;m<bits.length;m++){
      var b = bits[m];
      if(!b.collected && rectsOverlap(hb2,b)){ b.collected = true; collectBit(b); }
    }

    spawnEngineTrail(dt);
    updateParticles(dt);

    if(shake>0) shake = Math.max(0, shake - dt*40);

    score = Math.floor(distance) + bitScore;
  }

  // ---- render ----
  function drawMatrixRain(dt){
    ctx.font = '13px '+FONT_STACK;
    ctx.textAlign = 'center';
    var speedScale = (state==='playing') ? 1 : 0.5;
    if(reducedMotion) speedScale *= 0.2;
    for(var i=0;i<matrixCols.length;i++){
      var c = matrixCols[i];
      c.y += c.speed*dt*speedScale;
      if(c.y > H+40){ c.y = -Math.random()*140; c.ch = randChar(); }
      if(Math.random()<0.015) c.ch = randChar();
      for(var t=0;t<5;t++){
        var yy = c.y - t*16;
        if(yy < -16 || yy > H+16) continue;
        var alpha = (1-t/5)*0.5;
        ctx.fillStyle = 'rgba(57,255,136,'+alpha.toFixed(3)+')';
        ctx.fillText(c.ch, c.x, yy);
      }
    }
  }

  function drawRoad(dt){
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#0d1a29'); grad.addColorStop(1,'#08131d');
    ctx.fillStyle = grad;
    roundRect(ctx, roadLeft, -2, roadWidth, H+4, 10);
    ctx.fill();

    ctx.save();
    ctx.strokeStyle = 'rgba(76,224,255,0.55)';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#4ce0ff'; ctx.shadowBlur = 9;
    ctx.beginPath();
    ctx.moveTo(roadLeft,0); ctx.lineTo(roadLeft,H);
    ctx.moveTo(roadLeft+roadWidth,0); ctx.lineTo(roadLeft+roadWidth,H);
    ctx.stroke();
    ctx.restore();

    var visualSpeed = (state==='playing') ? scrollSpeed : 70;
    laneOffset = (laneOffset + visualSpeed*dt) % 40;
    ctx.save();
    ctx.strokeStyle = 'rgba(76,224,255,0.3)';
    ctx.lineWidth = 2;
    ctx.setLineDash([18,22]);
    ctx.lineDashOffset = -laneOffset;
    var l1 = roadLeft+roadWidth/3, l2 = roadLeft+roadWidth*2/3;
    ctx.beginPath();
    ctx.moveTo(l1,0); ctx.lineTo(l1,H);
    ctx.moveTo(l2,0); ctx.lineTo(l2,H);
    ctx.stroke();
    ctx.restore();
  }

  function drawObstacles(){
    for(var i=0;i<obstacles.length;i++){
      var o = obstacles[i];
      ctx.save();
      var grad = ctx.createLinearGradient(o.x,o.y,o.x,o.y+o.h);
      grad.addColorStop(0,'#ff6a6a'); grad.addColorStop(1,'#b3121f');
      ctx.fillStyle = grad;
      ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 13;
      ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 1;
      ctx.strokeRect(o.x+0.5,o.y+0.5,o.w-1,o.h-1);

      ctx.save();
      ctx.beginPath(); ctx.rect(o.x,o.y,o.w,o.h); ctx.clip();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 6;
      for(var sx=-o.h; sx<o.w+o.h; sx+=14){
        ctx.beginPath();
        ctx.moveTo(o.x+sx,o.y); ctx.lineTo(o.x+sx+o.h,o.y+o.h);
        ctx.stroke();
      }
      ctx.restore();

      if(o.w>44 && o.h>26){
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = '9px '+FONT_STACK;
        ctx.textAlign = 'center';
        ctx.fillText('ICE', o.x+o.w/2, o.y+o.h/2+3);
      }
      ctx.restore();
    }
  }

  function drawBits(){
    for(var i=0;i<bits.length;i++){
      var b = bits[i];
      var cx = b.x+b.w/2, cy = b.y+b.h/2;
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(Math.PI/4);
      ctx.shadowColor = '#4ce0ff'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#4ce0ff';
      ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.restore();
      ctx.fillStyle = 'rgba(207,236,226,0.65)';
      ctx.font = '8px '+FONT_STACK;
      ctx.textAlign = 'center';
      ctx.fillText(b.hex, cx, cy+b.h+9);
    }
  }

  function drawParticles(){
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      var a = Math.max(0, p.life/p.maxLife);
      ctx.fillStyle = 'rgba('+p.color+','+a.toFixed(3)+')';
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size*a+0.5,0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawPlayer(){
    ctx.save();
    ctx.translate(player.x, player.y);
    var tilt = clamp(player.vx/STEER_MAX,-1,1)*0.28;
    ctx.rotate(tilt);
    var alpha = 1;
    if(hitInvuln>0 && !overclockActive){
      alpha = (Math.floor(hitInvuln*14)%2===0) ? 0.35 : 1;
    }
    ctx.globalAlpha = alpha;
    var w = player.w, h = player.h;
    ctx.shadowColor = overclockActive ? '#ff3ec8' : '#39ff88';
    ctx.shadowBlur = overclockActive ? 20 : 13;
    var grad = ctx.createLinearGradient(0,-h/2,0,h/2);
    if(overclockActive){ grad.addColorStop(0,'#ffbdf0'); grad.addColorStop(1,'#ff3ec8'); }
    else { grad.addColorStop(0,'#a8ffce'); grad.addColorStop(1,'#1c8f52'); }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0,-h/2);
    ctx.lineTo(w/2,h/2-4);
    ctx.lineTo(w*0.26,h/2);
    ctx.lineTo(-w*0.26,h/2);
    ctx.lineTo(-w/2,h/2-4);
    ctx.closePath();
    ctx.fill();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(8,16,16,0.85)';
    ctx.beginPath();
    ctx.ellipse(0,-h*0.08,w*0.15,h*0.17,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function render(dt){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#04060b';
    ctx.fillRect(0,0,W,H);
    drawMatrixRain(dt);
    ctx.save();
    if(shake>0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }
    drawRoad(dt);
    drawObstacles();
    drawBits();
    drawParticles();
    drawPlayer();
    ctx.restore();
  }

  function updateHUD(){
    scoreEl.textContent = String(Math.floor(score)).padStart(6,'0');
    bestEl.textContent = String(Math.floor(Math.max(best,score))).padStart(6,'0');
    spdEl.textContent = String(Math.round(scrollSpeed/3)).padStart(3,'0');
    for(var i=0;i<pipEls.length;i++){
      pipEls[i].classList.toggle('lost', i>=hull);
    }
    meterFill.style.width = meter+'%';
    meterWrap.classList.toggle('ready', meter>=100 && !overclockActive);
  }

  var lastT = null;
  function frame(ts){
    if(lastT===null) lastT = ts;
    var dt = (ts-lastT)/1000;
    lastT = ts;
    dt = Math.min(dt, 0.05);
    update(dt);
    render(dt);
    updateHUD();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
